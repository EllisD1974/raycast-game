[project]
name = "raycast-game"
version = "0.1.0"
description = "A raycaster with stacked floors, ramps and a built-in map editor"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numba>=0.60",
    "numpy>=2.0",
    "pygame-ce>=2.5",
]

# Commands run with `uv run <name>`. The project is installed (in development mode) only so these exist; it is not
# meant to be built as a package.
[project.scripts]
build = "buildtool:main"        # build the game and the editor locally, as a dev version (buildtool.py)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["buildtool.py", "version.py"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.13"