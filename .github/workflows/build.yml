name: Build

# Run by hand: GitHub > Actions > "Build" > Run workflow (pick the branch to build). Builds the game and the map editor
# for every platform at once, each in its own job with its own artifact:
#   RaycastGame-windows-<run>  a zip of RaycastGame/ with RaycastGame.exe and RaycastEditor.exe
#   RaycastGame-linux-<run>    a tarball of RaycastGame/ with RaycastGame and RaycastEditor (a zip would lose their
#                              executable bit)
# PyInstaller cannot cross-build, so each platform is built on its own.
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the tests before building
        type: boolean
        default: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy        # no screen on the runner: pygame draws to nothing
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (Python version from .python-version, packages from uv.lock)
        run: uv sync --group dev

      - name: Run the tests
        if: ${{ inputs.run_tests }}
        run: uv run pytest -q

      - name: Build the game and the editor
        run: uv run pyinstaller raycast-game.spec --noconfirm

      - name: Check the built game runs (it renders one frame and exits)
        shell: bash
        run: |
          dist/RaycastGame/RaycastGame.exe --snapshot smoke.png
          test -s smoke.png

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path dist/RaycastGame -DestinationPath RaycastGame-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: RaycastGame-windows-${{ github.run_number }}
          path: RaycastGame-windows.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    # Built inside Valve's Steam Linux Runtime 3.0 ("sniper") SDK image, so the program needs no newer system libraries
    # (glibc above all) than the runtime Steam starts Linux games in; built on a newer distro it could fail to start on
    # older ones. Python comes from uv (python-build-standalone), not from the image.
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (Python version from .python-version, packages from uv.lock)
        run: uv sync --group dev

      - name: Run the tests
        if: ${{ inputs.run_tests }}
        run: uv run pytest -q

      - name: Build the game and the editor
        run: uv run pyinstaller raycast-game.spec --noconfirm

      - name: Check the built game runs (it renders one frame and exits)
        run: |
          dist/RaycastGame/RaycastGame --snapshot smoke.png
          test -s smoke.png

      - name: Pack it
        run: tar -czf RaycastGame-linux.tar.gz -C dist RaycastGame

      - uses: actions/upload-artifact@v7
        with:
          name: RaycastGame-linux-${{ github.run_number }}
          path: RaycastGame-linux.tar.gz
          if-no-files-found: error
          retention-days: 30
